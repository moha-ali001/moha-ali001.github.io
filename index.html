<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Google Tag Manager -->
    <script>(function (w, d, s, l, i) {
            w[l] = w[l] || []; w[l].push({
                'gtm.start':
                    new Date().getTime(), event: 'gtm.js'
            }); var f = d.getElementsByTagName(s)[0],
                j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : ''; j.async = true; j.src =
                    'https://www.googletagmanager.com/gtm.js?id=' + i + dl; f.parentNode.insertBefore(j, f);
        })(window, document, 'script', 'dataLayer', 'GTM-MSQH8BPR');</script>
    <!-- End Google Tag Manager -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
</head>

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MSQH8BPR" height="0" width="0"
            style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <h1>Welcome to My Website</h1>
    <h1 id="product-name">Super Widget</h1>
    <p>Price: $<span id="product-price">19.99</span></p>

    <!-- Data Layer Push -->
    <script>
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({
            'event': 'product_view',
            'product_name': document.getElementById('product-name').innerText,
            'product_price': document.getElementById('product-price').innerText
        });
    </script>

    <button onClick="sendData()">Send Product Data</button>

    <script>
        async function sendData() {
            const item = window.dataLayer.find(i => i.event === 'product_view');

            const response = await fetch('https://httpbin.org/post', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    product_name: item.product_name,
                    product_price: item.product_price
                })
            });

            const data = await response.json();
            console.log(data);
        }
    </script>
</body>

</html>
